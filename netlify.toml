# Forms: Netlify honeypot (bot-field), hidden company_website trap, client timing + rate limits
# (src/lib/formBotGuard.js). In Netlify UI: Forms → spam filters / Akismet on; consider reCAPTCHA
# if abuse persists. robots.txt blocks aggressive SEO crawlers; POST / is not crawlable.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify nvm does not provide Node 24; Vite 7 runs on 22 LTS.
  NODE_VERSION = "22"
