<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img">
  <title>Joule in-VPC data boundary</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#95a2b3"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e36a3d"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#0b0e12"/>
  <text x="48" y="62" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="650" fill="#e8edf3">Runs entirely inside your VPC.</text>
  <text x="48" y="94" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#95a2b3">Licensed Joule runtime in your tenant. No default egress to Joule systems.</text>

  <rect x="48" y="118" width="852" height="276" rx="16" fill="#0d1117" fill-opacity="0.5" stroke="#95a2b3" stroke-width="1.3" stroke-dasharray="6 5"/>
  <rect x="68" y="109" width="190" height="18" fill="#0b0e12"/>
  <text x="76" y="122" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#95a2b3" letter-spacing="1.4">YOUR VPC · YOUR TENANT</text>

  <!-- Box 1: x=76 w=218 -->
  <rect x="76" y="150" width="218" height="214" rx="10" fill="#11161d" stroke="#263243"/>
  <text x="92" y="178" font-family="Inter, sans-serif" font-size="15" font-weight="650" fill="#e8edf3">Your inference</text>
  <text x="92" y="198" font-family="Inter, sans-serif" font-size="12" fill="#95a2b3">Production LLM serving</text>
  <rect x="92" y="212" width="186" height="44" rx="6" fill="#161c25"/>
  <text x="104" y="232" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e8edf3">GPU cluster</text>
  <text x="104" y="248" font-family="Inter, sans-serif" font-size="11" fill="#5f6b7c">runtimes you operate</text>
  <rect x="92" y="264" width="186" height="36" rx="6" fill="#161c25"/>
  <text x="104" y="286" font-family="'JetBrains Mono', monospace" font-size="10" fill="#747a84">LIVE TRAFFIC · BATCHED REQUESTS</text>
  <g opacity="0.55">
    <rect x="92" y="308" width="44" height="8" rx="2" fill="#34d399"/>
    <rect x="140" y="308" width="32" height="8" rx="2" fill="#34d399"/>
    <rect x="176" y="308" width="24" height="8" rx="2" fill="#747a84"/>
    <rect x="204" y="308" width="36" height="8" rx="2" fill="#34d399"/>
    <rect x="244" y="308" width="34" height="8" rx="2" fill="#f87171" opacity="0.7"/>
  </g>
  <text x="92" y="338" font-family="Inter, sans-serif" font-size="11" fill="#5f6b7c">utilization ≠ goodput</text>

  <!-- Gap 1 + metrics (76+218=294 → box2 at 372, gap 78px) -->
  <text x="333" y="248" font-family="'JetBrains Mono', monospace" font-size="10" fill="#969da6" text-anchor="middle">metrics</text>
  <line x1="298" y1="268" x2="368" y2="268" stroke="#e36a3d" stroke-width="1.6" marker-end="url(#arrO)"/>

  <!-- Box 2: x=372 w=292 -->
  <rect x="372" y="150" width="292" height="214" rx="10" fill="#11161d" stroke="#e36a3d" stroke-width="1.5"/>
  <text x="388" y="178" font-family="Inter, sans-serif" font-size="15" font-weight="650" fill="#e36a3d">Licensed Joule</text>
  <text x="388" y="196" font-family="Inter, sans-serif" font-size="15" font-weight="650" fill="#e36a3d">runtime</text>
  <rect x="562" y="158" width="92" height="18" rx="4" fill="#0b0e12" stroke="#e36a3d" stroke-width="1"/>
  <text x="608" y="170" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e36a3d" text-anchor="middle">IN TENANT</text>
  <text x="388" y="216" font-family="Inter, sans-serif" font-size="12" fill="#95a2b3">Measurement · economics · SLO</text>
  <rect x="388" y="226" width="62" height="22" rx="4" fill="#0b0e12" stroke="#e36a3d" stroke-width="1"/>
  <text x="419" y="241" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e36a3d" text-anchor="middle">$/M tok</text>
  <rect x="458" y="226" width="62" height="22" rx="4" fill="#0b0e12" stroke="#29323d"/>
  <text x="489" y="241" font-family="'JetBrains Mono', monospace" font-size="9" fill="#969da6" text-anchor="middle">tokens/W</text>
  <rect x="528" y="226" width="62" height="22" rx="4" fill="#0b0e12" stroke="#29323d"/>
  <text x="559" y="241" font-family="'JetBrains Mono', monospace" font-size="9" fill="#969da6" text-anchor="middle">TTFT·TPOT</text>
  <polyline points="388,310 412,310 422,294 432,318 446,302 470,302 488,290 512,310 536,310 558,304 584,310 608,302 632,310 648,304" fill="none" stroke="#e36a3d" stroke-width="1.8" opacity="0.85"/>
  <line x1="388" y1="322" x2="648" y2="322" stroke="#232a32"/>
  <text x="388" y="342" font-family="Inter, sans-serif" font-size="11" fill="#5f6b7c">power · latency · throughput</text>

  <!-- Gap 2 + readouts (372+292=664 → box3 at 742, gap 78px) -->
  <text x="703" y="248" font-family="'JetBrains Mono', monospace" font-size="10" fill="#969da6" text-anchor="middle">readouts</text>
  <line x1="668" y1="268" x2="738" y2="268" stroke="#95a2b3" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 3: x=742 w=148 -->
  <rect x="742" y="150" width="148" height="214" rx="10" fill="#11161d" stroke="#263243"/>
  <text x="758" y="178" font-family="Inter, sans-serif" font-size="15" font-weight="650" fill="#e8edf3">Your team</text>
  <text x="758" y="198" font-family="Inter, sans-serif" font-size="12" fill="#95a2b3">Readouts &amp; reviews</text>
  <rect x="758" y="212" width="116" height="72" rx="6" fill="#161c25" stroke="#232a32"/>
  <text x="768" y="230" font-family="'JetBrains Mono', monospace" font-size="8" fill="#747a84" letter-spacing="0.8">DASHBOARD</text>
  <text x="768" y="252" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#61b8a9">SLO goodput</text>
  <text x="768" y="270" font-family="Inter, sans-serif" font-size="10" fill="#95a2b3">$/M · P99</text>
  <rect x="758" y="294" width="116" height="24" rx="4" fill="#0b0e12" stroke="#29323d"/>
  <text x="816" y="310" font-family="Inter, sans-serif" font-size="10" fill="#969da6" text-anchor="middle">API · RBAC · SSO</text>
  <text x="758" y="342" font-family="Inter, sans-serif" font-size="11" fill="#5f6b7c">in your accounts</text>

  <!-- Vendor boundary (742+148=890) -->
  <rect x="998" y="186" width="142" height="122" rx="10" fill="#11161d" stroke="#263243" stroke-dasharray="4 4"/>
  <text x="1069" y="228" font-family="Inter, sans-serif" font-size="15" font-weight="650" fill="#95a2b3" text-anchor="middle">Joule</text>
  <text x="1069" y="248" font-family="Inter, sans-serif" font-size="12" fill="#5f6b7c" text-anchor="middle">(vendor)</text>
  <text x="1069" y="272" font-family="Inter, sans-serif" font-size="11" fill="#5f6b7c" text-anchor="middle">no default</text>
  <text x="1069" y="288" font-family="Inter, sans-serif" font-size="11" fill="#5f6b7c" text-anchor="middle">data path</text>
  <line x1="888" y1="248" x2="994" y2="248" stroke="#5f6b7c" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="941" cy="248" r="13" fill="#0b0e12" stroke="#f87171" stroke-width="1.6"/>
  <line x1="936" y1="243" x2="946" y2="253" stroke="#f87171" stroke-width="2"/>
  <line x1="936" y1="253" x2="946" y2="243" stroke="#f87171" stroke-width="2"/>
  <text x="941" y="278" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">no egress</text>

  <rect x="76" y="378" width="814" height="28" rx="4" fill="#161c25" stroke="#232a32"/>
  <text x="92" y="396" font-family="'JetBrains Mono', monospace" font-size="10" fill="#747a84">ISOLATED HOSTS</text>
  <text x="240" y="396" font-family="'JetBrains Mono', monospace" font-size="10" fill="#747a84">·</text>
  <text x="256" y="396" font-family="'JetBrains Mono', monospace" font-size="10" fill="#747a84">CUSTOMER KMS / NETWORK POLICY</text>
  <text x="520" y="396" font-family="'JetBrains Mono', monospace" font-size="10" fill="#747a84">·</text>
  <text x="536" y="396" font-family="'JetBrains Mono', monospace" font-size="10" fill="#747a84">AUDIT LOGS IN YOUR TENANT</text>

  <text x="48" y="438" font-family="Inter, sans-serif" font-size="12" font-weight="650" fill="#e8edf3">You own</text>
  <text x="108" y="438" font-family="'JetBrains Mono', monospace" font-size="12" fill="#95a2b3">telemetry outputs, dashboards, and economics readouts</text>
  <text x="48" y="460" font-family="Inter, sans-serif" font-size="12" font-weight="650" fill="#e8edf3">Not shared</text>
  <text x="128" y="460" font-family="'JetBrains Mono', monospace" font-size="12" fill="#95a2b3">prompts · weights · proprietary Joule software</text>
</svg>
