<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Joule intake forms</title>
  </head>
  <body>
    <!-- Netlify form detection (SPA); fields mirrored in IntakePage.jsx -->
    <form name="design-partner-program" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="company" type="text" />
      <input name="role" type="text" />
      <textarea name="context"></textarea>
      <input name="bot-field" />
    </form>
    <form name="retainer-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="company" type="text" />
      <input name="role" type="text" />
      <input name="baseline" type="text" />
      <textarea name="context"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
